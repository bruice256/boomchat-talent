name: boomchat_talent
description: "BoomChat Talent - All-in-One Communication, Universal File Explorer & Christian Spiritual Growth Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  font_awesome_flutter: ^10.7.0

  # Firebase Suite - versions compatible with Flutter 3.24.x
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  firebase_storage: ^11.6.9

  # Permissions & System
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  file_picker: ^8.0.3
  open_filex: ^4.4.0
  share_plus: ^9.0.0

  # Audio & Media Playback
  just_audio: ^0.9.36
  audio_video_progress_bar: ^2.0.3
  record: ^5.1.0
  video_player: ^2.8.5
  chewie: ^1.8.1

  # Document Viewers
  syncfusion_flutter_pdfviewer: ^24.2.9
  excel: ^4.0.3

  # WebRTC & Real-time Calling
  flutter_webrtc: ^0.10.8

  # Image handling
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
